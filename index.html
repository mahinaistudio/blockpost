<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockpost — Servers</title>
<meta name="description" content="Quick access to all our game servers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --surface:#111113;
    --surface-2:#17171a;
    --border:#232327;
    --border-hi:#34343a;
    --text:#f4f4f5;
    --muted:#8a8a94;
    --accent:#e8e8ea;
    --radius:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 24px 80px;
    -webkit-font-smoothing:antialiased;
  }

  /* subtle top glow */
  body::before{
    content:'';
    position:fixed;
    top:-40%;
    left:50%;
    transform:translateX(-50%);
    width:900px;
    height:600px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.05), transparent 65%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{width:100%;max-width:880px;position:relative;z-index:1}

  /* ---------- header ---------- */
  header{text-align:center;margin-bottom:44px}

  h1{
    font-size:clamp(28px,5vw,38px);
    font-weight:700;
    letter-spacing:-.03em;
    margin-bottom:10px;
  }

  .sub{
    color:var(--muted);
    font-size:14.5px;
    letter-spacing:.01em;
  }

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
  }

  .card{
    display:block;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }

  .card:hover{
    border-color:var(--border-hi);
    transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }

  .thumb{
    position:relative;
    aspect-ratio:16/9;
    background:var(--surface-2);
    overflow:hidden;
  }

  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:top;
    display:block;
    transition:transform .35s cubic-bezier(.2,.7,.3,1);
  }

  .card:hover .thumb img{transform:scale(1.045)}

  .meta{
    padding:14px 16px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .name{
    font-size:14.5px;
    font-weight:600;
    letter-spacing:-.01em;
  }

  .tag{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
    letter-spacing:.01em;
  }

  .arrow{
    flex-shrink:0;
    width:26px;height:26px;
    display:grid;place-items:center;
    border-radius:50%;
    border:1px solid var(--border);
    color:var(--muted);
    transition:all .2s ease;
  }

  .card:hover .arrow{
    background:var(--accent);
    border-color:var(--accent);
    color:#0a0a0b;
  }

  .arrow svg{width:13px;height:13px}

  /* ---------- footer ---------- */
  footer{
    margin-top:56px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
  }

  @media (max-width:520px){
    body{padding:44px 18px 60px}
    .grid{grid-template-columns:1fr;gap:14px}
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Blockpost Servers</h1>
    <p class="sub">Pick a server to jump in.</p>
  </header>

  <!-- =======================================================
       EDIT HERE: add / remove / change servers.
       Just copy one <a class="card"> block per server.
       - href      = the server website link
       - img src   = the image/banner link
       - .name     = server name
       - .tag      = small label under the name (optional)
       ======================================================= -->
  <main class="grid" id="grid">

    <a class="card" href="https://poki.com/en/g/blockpost" target="_blank" rel="noopener">
      <div class="thumb">
        <img src="blockpost-logo.jpg" alt="Blockpost on Poki" loading="lazy">
      </div>
      <div class="meta">
        <div>
          <div class="name">Poki</div>
          <div class="tag">Blockpost</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </span>
      </div>
    </a>

    <a class="card" href="https://hotgames.io/blockpost" target="_blank" rel="noopener">
      <div class="thumb">
        <img src="blockpost-logo.jpg" alt="Blockpost on HotGames" loading="lazy">
      </div>
      <div class="meta">
        <div>
          <div class="name">HotGames</div>
          <div class="tag">Blockpost</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </span>
      </div>
    </a>

    <a class="card" href="https://nite.games/game/blockpost" target="_blank" rel="noopener">
      <div class="thumb">
        <img src="blockpost-logo.jpg" alt="Blockpost on Nite Games" loading="lazy">
      </div>
      <div class="meta">
        <div>
          <div class="name">Nite Games</div>
          <div class="tag">Blockpost</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </span>
      </div>
    </a>

    <a class="card" href="https://kbhgames.com/game/block-post-online" target="_blank" rel="noopener">
      <div class="thumb">
        <img src="blockpost-logo.jpg" alt="Blockpost on KBH Games" loading="lazy">
      </div>
      <div class="meta">
        <div>
          <div class="name">KBH Games</div>
          <div class="tag">Blockpost</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </span>
      </div>
    </a>

    <a class="card" href="https://startgamer.net/game/29681" target="_blank" rel="noopener">
      <div class="thumb">
        <img src="blockpost-logo.jpg" alt="Blockpost on StartGamer" loading="lazy">
      </div>
      <div class="meta">
        <div>
          <div class="name">StartGamer</div>
          <div class="tag">Blockpost</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </span>
      </div>
    </a>

  </main>

  <footer>&copy; <span id="year"></span> Blockpost Servers</footer>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>

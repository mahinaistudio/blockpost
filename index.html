function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function loadData() {
  var raw = null;
  try { raw = localStorage.getItem(DATA_KEY); } catch (e) {}
  if (raw) {
    try {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.players && parsed.matches && parsed.agreement) return parsed;
    } catch (e) {}
  }
  return {

function saveData() {
  try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); } catch (e) {}

var DRIVE_CLIENT_ID = "294127365372-ek508nb2eccj1dpksl9lgnh84q8q3rag.apps.googleusercontent.com";
var DRIVE_API_KEY = "AIzaSyC7fL3tbWi1Ugsyr8zM2lQ6I_2zJ5YqygA";
var DRIVE_FILE_NAME = "blockpost-db.json";
var DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile";

var driveState = {
  token: "",

};

function driveGetFileId() {
  if (PUBLIC_FILE_ID) return PUBLIC_FILE_ID;
  if (driveState.fileId) return driveState.fileId;
  try {
    driveState.fileId = localStorage.getItem("bpnl-drive-fileid") || "";
  } catch (e) {
    driveState.fileId = "";
  }
  return driveState.fileId;
}

function driveSetFileId(id) {
  driveState.fileId = id;
  try { localStorage.setItem("bpnl-drive-fileid", id); } catch (e) {}
}

function driveDisconnect() {
  driveState.token = "";
  driveState.connected = false;
  driveState.lastError = "";
  driveState.lastSync = null;
  try {
    localStorage.removeItem("bpnl-drive-token");
    localStorage.removeItem("bpnl-drive-token-exp");
  } catch (e) {}
  driveRefreshUi();
}

function driveGetToken() {
  if (driveState.token) return driveState.token;
  var t = null;
  var e = 0;
  try {
    t = localStorage.getItem("bpnl-drive-token");
    e = Number(localStorage.getItem("bpnl-drive-token-exp") || 0);
  } catch (err) {}
  if (t && e > Date.now()) {
    driveState.token = t;
    return t;
  }
  return "";
}

function driveSaveToken(tok, expIn) {
  driveState.token = tok;
  try {
    localStorage.setItem("bpnl-drive-token", tok);
    localStorage.setItem("bpnl-drive-token-exp", String(Date.now() + (expIn || 3600) * 1000));
  } catch (e) {}
}

function driveCreateFile(token) {
  var boundary = "bpnl_bnd_" + Date.now();
  var payload = "--" + boundary + "\r\n" +
    "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
    JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json" }) + "\r\n" +
    "--" + boundary + "\r\n" +
    "Content-Type: application/json\r\n\r\n" +
    JSON.stringify(data) + "\r\n" +
    "--" + boundary + "--";
  return fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "multipart/related; boundary=" + boundary },
    body: payload
  }).then(function (r) {
    if (!r.ok) throw new Error("create failed " + r.status);
    return r.json();
  }).then(function (j) { return j.id; });
}

function driveSharePublic(token, fileId) {
  return fetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "/permissions?sendNotificationEmail=false", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ role: "reader", type: "anyone" })
  }).then(function (r) {
    if (!r.ok) throw new Error("share failed " + r.status);
  });
}

function driveUpdateFile(token, fileId) {
  return fetch("https://www.googleapis.com/upload/drive/v3/files/" + encodeURIComponent(fileId) + "?uploadType=media", {
    method: "PATCH",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).then(function (r) {
    if (!r.ok) throw new Error("save failed " + r.status);
    return r.json();
  });
}

function drivePush() {
  var token = driveGetToken();
  if (!token) {
    driveState.lastError = "Reconnect Google Drive";
    driveRefreshUi();
    return Promise.resolve();
  }
  driveState.syncing = true;
  data.lastUpdated = new Date().toISOString();
  var fileId = driveGetFileId();
  var op;
  if (fileId) {
    op = driveUpdateFile(token, fileId);
  } else {
    op = driveCreateFile(token).then(function (id) {
      driveSetFileId(id);
      return driveSharePublic(token, id);
    });
  }
  return op.then(function () {
    driveState.syncing = false;
    driveState.connected = true;
    driveState.lastSync = new Date().toISOString();
    driveState.lastError = "";
    driveRefreshUi();
  }).catch(function (err) {
    driveState.syncing = false;
    driveState.lastError = (err && err.message) ? err.message : "drive error";
    driveRefreshUi();
  });
}

function driveSchedulePush() {
  if (state.role !== "admin") return;
  if (!driveGetToken() || !driveGetFileId()) return;
  if (driveState.pushTimer) clearTimeout(driveState.pushTimer);
  driveState.pushTimer = setTimeout(function () {
    driveState.pushTimer = null;
    drivePush();
  }, 1200);
}

function drivePull() {
  var fileId = driveGetFileId();
  if (!fileId) return Promise.resolve(null);
  if (window.gapi && gapi.client && gapi.client.drive) {
    return gapi.client.drive.files.get({ fileId: fileId, alt: "media" })
      .then(function (resp) { return resp.result; });
  }
  var url = "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "?alt=media&key=" + DRIVE_API_KEY;
  return fetch(url)
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); });
}

function driveMaybeAdopt(remote) {
  if (!remote || !remote.lastUpdated) return false;
  var local = data.lastUpdated ? String(data.lastUpdated) : "";
  if (!local || String(remote.lastUpdated) > local) {
    data = remote;
    try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); } catch (e) {}
    return true;
  }
  return false;
}

function driveRefreshUi() {
  renderForRoute();
}

function driveBoot() {
  var fileId = driveGetFileId();
  if (!fileId) return;
  drivePull().then(function (remote) {
    var adopted = remote && driveMaybeAdopt(remote);
    if (adopted) {
      driveState.lastSync = new Date().toISOString();
      driveState.connected = true;
    }
    if (state.role === "admin" && driveGetToken()) {
      var localTs = data.lastUpdated ? String(data.lastUpdated) : "";
      var remoteTs = remote && remote.lastUpdated ? String(remote.lastUpdated) : "";
      if (!remoteTs || localTs > remoteTs) {
        drivePush();
        return;
      }
    }
    driveRefreshUi();
  }).catch(function () {
    driveRefreshUi();
  });
}

function driveConnect() {
  return new Promise(function (resolve, reject) {
    if (!DRIVE_CLIENT_ID || DRIVE_CLIENT_ID.indexOf("YOUR_CLIENT_ID") === 0) {
      customAlert("Drive sync is not configured yet. Open setup.md and paste your OAuth Client ID into index.html (DRIVE_CLIENT_ID).", "warn");
      return reject();
    }
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      customAlert("Google sign-in is still loading — try again in a second.", "info");
      return reject();
    }
    function onToken(resp) {
      if (resp && resp.access_token) {
        gapi.client.setToken({ access_token: resp.access_token });
        gapi.client.drive.about.get({ fields: "user" }).then(function (r) {
          var email = (r.result.user && r.result.user.emailAddress) || "unknown";
          var allowed = ALLOWED_ADMINS.map(function (e) { return e.toLowerCase(); });
          if (allowed.indexOf(email.toLowerCase()) === -1) {
            customAlert("Access denied. " + email + " is not an authorized admin.", "danger");
            gapi.client.setToken(null);
            driveState.lastError = "Access denied";
            driveRefreshUi();
            return reject();
          }
          driveSaveToken(resp.access_token, resp.expires_in || 3600);
          driveState.connected = true;
          driveState.lastError = "";
          drivePush();
          resolve();
        }).catch(function () {
          driveSaveToken(resp.access_token, resp.expires_in || 3600);
          driveState.connected = true;
          driveState.lastError = "";
          drivePush();
          resolve();
        });
      } else {
        driveState.lastError = "Sign-in was cancelled.";
        driveRefreshUi();
        reject();
      }
    }
    if (!driveState.tokenClient) {
      driveState.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: onToken
      });
    }
    driveState.tokenClient.requestAccessToken({ prompt: "consent" });
  });
}

}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function customAlert(message, type) {
  type = type || "info";
  var iconMap = { info: "info", warn: "warning", danger: "trash" };
  var svgIcon = icon(iconMap[type] || "info", 22);
  var backdrop = document.createElement("div");
  backdrop.className = "custom-modal-backdrop";
  backdrop.innerHTML = '<div class="custom-modal">' +
    '<div class="modal-icon ' + type + '">' + svgIcon + "</div>" +
    "<h3>" + esc(message) + "</h3>" +
    '<div class="modal-actions">' +
      '<button class="btn-primary" data-modal-ok>Got it</button>' +
    "</div>" +
  "</div>";
  document.body.appendChild(backdrop);
  backdrop.querySelector("[data-modal-ok]").focus();
  return new Promise(function (resolve) {
    function close() { backdrop.remove(); resolve(); }
    backdrop.querySelector("[data-modal-ok]").addEventListener("click", close);
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    backdrop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === "Escape") close(); });
  });
}

function customConfirm(message) {
  var backdrop = document.createElement("div");
  backdrop.className = "custom-modal-backdrop";
  backdrop.innerHTML = '<div class="custom-modal">' +
    '<div class="modal-icon warn">' + icon("shield", 22) + "</div>" +
    "<h3>" + esc(message) + "</h3>" +
    '<div class="modal-actions">' +
      '<button class="btn-ghost" data-modal-cancel>Cancel</button>' +
      '<button class="btn-primary" style="background:hsl(var(--destructive));border-color:hsl(var(--destructive))" data-modal-confirm>Confirm</button>' +
    "</div>" +
  "</div>";
  document.body.appendChild(backdrop);
  backdrop.querySelector("[data-modal-cancel]").focus();
  return new Promise(function (resolve) {
    function close(val) { backdrop.remove(); resolve(val); }
    backdrop.querySelector("[data-modal-cancel]").addEventListener("click", function () { close(false); });
    backdrop.querySelector("[data-modal-confirm]").addEventListener("click", function () { close(true); });
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(false); });
    backdrop.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close(false);
      if (e.key === "Enter") close(true);
    });
  });
}

function initCustomSelects() {
  document.querySelectorAll(".custom-select-wrap").forEach(function (wrap) {
    var trigger = wrap.querySelector(".custom-select-trigger");
    var hidden = wrap.querySelector("input[type=hidden]");
    var options = wrap.querySelectorAll(".custom-select-option");

    function selectOption(opt) {
      options.forEach(function (o) { o.classList.remove("selected"); });
      opt.classList.add("selected");
      trigger.querySelector(".select-label").textContent = opt.textContent;
      if (hidden) {
        hidden.value = opt.getAttribute("data-value");
        hidden.dispatchEvent(new Event("change", { bubbles: true }));
      }
      wrap.classList.remove("open");
    }

    trigger.addEventListener("click", function (e) {
      e.stopPropagation();
      document.querySelectorAll(".custom-select-wrap.open").forEach(function (w) { w.classList.remove("open"); });
      wrap.classList.toggle("open");
    });

    options.forEach(function (opt) {
      opt.addEventListener("click", function () { selectOption(opt); });
    });

    var selected = wrap.querySelector(".custom-select-option.selected");
    if (selected) {
      trigger.querySelector(".select-label").textContent = selected.textContent;
    }
  });

  document.addEventListener("click", function () {
    document.querySelectorAll(".custom-select-wrap.open").forEach(function (w) { w.classList.remove("open"); });
  });
}

function dashboardHtml() {
  var trendMax = Math.max.apply(null, sampleSummary.dailyTrend.map(function (x) { return x.kills; }).concat([1]));

  var stats = [
    ["Matches logged", sampleSummary.totalMatches, "since launch"],
    ["Total kills", sampleSummary.totalKills, "across all modes"],
    ["Total deaths", sampleSummary.totalDeaths, "every round counts"],
    ["Avg. kills / match", sampleSummary.averageKills.toFixed(1), "squad average"]
  ].map(function (s, i) {
    return '<div class="panel rise delay-' + (i + 1) + ' p-5">' +

  }).join("");

  var sortedPlayers = sampleSummary.playerSummaries.slice().sort(function (a, b) { return b.kd - a.kd; });
  var playerRows = sortedPlayers.map(function (player, i) {

      '<div class="text-right">' +
        '<div class="font-mono-app text-sm' + colorClass + '">' + player.kd.toFixed(2) + " K/D</div>" +
        '<div class="tiny text-muted-foreground">' + player.winRate.toFixed(1) + "% win rate</div>" +
      "</div>" +
    "</div>";
  }).join("");

  var recent = recentMatchesHtml(data.matches);

  return pageHeadHtml(
    "Night league / live board",

    "A quick read on the squad’s current form, recent rounds, and who is carrying the radio.",

function matchesHtml() {

  var focus = params.get("focus");
  var filterType = params.get("type") || "all";
  var search = params.get("q") || "";
  var filtered = data.matches.filter(function (m) {
    return (filterType === "all" || m.matchType === filterType) &&
      (m.server + " " + (m.note || "")).toLowerCase().indexOf(search.toLowerCase()) !== -1;
  });

  var filterBtns = ["all", "knife", "gun", "sniper"].map(function (item) {
    var activeCls = filterType === item ? ' style="border-color:hsl(var(--primary));background:hsl(var(--primary) / .1);color:hsl(var(--primary))"' : "";
    return '<a href="#/matches?' +
      (item !== "all" ? "type=" + item : "") +

  var rows = filtered.map(function (match) {

    return '<div class="matchlist-row border-b p-4 last-border-0' + rowCls + '">' +
      '<div class="micro font-mono-app text-muted-foreground">' + fmtDate(match.playedOn) + "</div>" +
      "<div>" + matchBadgeHtml(match.matchType) + "</div>" +
      '<div class="min-w-0">' +
        '<div class="truncate text-sm font-bold">' + esc(match.server) + "</div>" +

      "</div>" +
      '<div class="font-display text-3xl font-bold">' +

        '<span class="mx-1" style="color:hsl(var(--muted-foreground) / .4)">—</span>' +

      "</div>" +
      '<div class="flex gap-1">' +

        '<button class="btn-danger btn-icon" data-delete-match="' + match.id + '">' + icon("trash", 13) + "</button>" +
      "</div>" +

  }).join("");

  var listBody;
  if (filtered.length === 0) {
    listBody = '<div class="panel flex flex-col items-center justify-center px-5 py-16 text-center">' +
      '<div class="mb-3 rounded-xl p-3" style="background:hsl(var(--accent) / .2)">' + icon("cross", 22) + "</div>" +
      '<h2 class="font-display text-2xl font-bold uppercase">No matches found</h2>' +
      '<p class="mt-2 max-w-sm text-sm text-muted-foreground">Try another filter or record the first result of the night.</p>' +
      '<a href="#/matches/new" class="btn-primary mt-5">' + icon("plus", 15) + "Record result</a>" +
    "</div>";
  } else {
    listBody = '<div class="panel overflow-hidden">' +
      '<div class="matchlist-head border-b px-5 py-3" style="background:hsl(var(--muted) / .4)">' +
        '<span class="tiny font-bold uppercase tracking-wider text-muted-foreground">Date</span>' +
        '<span class="tiny font-bold uppercase tracking-wider text-muted-foreground">Mode</span>' +
        '<span class="tiny font-bold uppercase tracking-wider text-muted-foreground">Server / note</span>' +
        '<span class="tiny font-bold uppercase tracking-wider text-muted-foreground">Score</span>' +
        '<span class="tiny font-bold uppercase tracking-wider text-muted-foreground">Actions</span>' +
      "</div>" +
      rows +

  }

  return pageHeadHtml(

    "Match history",
    "Receipts from the night shift. Filter by mode, inspect the scoreboard, or correct an entry.",
    '<a href="#/matches/new" class="btn-primary">' + icon("plus", 16) + "New result</a>"
  ) +
  '<div class="mb-5 flex flex-col gap-3 sm-row">' +
    '<div class="relative flex-1">' +
      '<span class="absolute" style="left:.75rem;top:.75rem;color:hsl(var(--muted-foreground))">' + icon("filter", 15) + "</span>" +

    "</div>" +
    '<div class="flex gap-2">' + filterBtns + "</div>" +
  "</div>" +
  listBody;
}
function matchFormHtml() {
  var params = new URLSearchParams((getRoute().split("?")[1] || ""));

  var existing = data.matches.find(function (m) { return m.id === editId; });

  if (editing && existing) {
    var playerStats = {};
    existing.players.forEach(function (p) { playerStats[p.playerId] = p; });
  } else {
    playerStats = {};
  }

  var dateVal = editing && existing ? existing.playedOn.slice(0, 10) : new Date().toISOString().slice(0, 10);
  var typeVal = editing && existing ? existing.matchType : "gun";
  var serverVal = editing && existing ? existing.server : "";
  var alphaVal = editing && existing ? existing.alphaScore : 0;
  var bravoVal = editing && existing ? existing.bravoScore : 0;
  var noteVal = editing && existing ? (existing.note || "") : "";

  var statsRows = data.players.map(function (player) {
    var st = playerStats[player.id];
    return '<div class="flex items-center gap-3 border-b p-4 last-border-0">' +

  return pageHeadHtml(

  '<form class="form-grid" data-match-form>' +

            '</button>' +
            '<div class="custom-select-dropdown">' +
              '<button type="button" class="custom-select-option' + (typeVal === "knife" ? " selected" : "") + '" data-value="knife">Knife</button>' +
              '<button type="button" class="custom-select-option' + (typeVal === "gun" ? " selected" : "") + '" data-value="gun">Gun</button>' +
              '<button type="button" class="custom-select-option' + (typeVal === "sniper" ? " selected" : "") + '" data-value="sniper">Sniper</button>' +
            '</div>' +
          '</div>' +
        "</label>" +
      "</div>" +
      '<label class="mt-4 block">' +
        '<span class="field-label">Server name</span>' +

      "</label>" +
      '<div class="mt-6 flex flex-wrap justify-end gap-2">' +

function renderForRoute() {
  var route = getRoute();
  var page = route.split("?")[0];

  var html;
  if (page === "/") {
    html = homeHtml();
  } else {
    var content;
    switch (page) {
      case "/dashboard": content = dashboardHtml(); break;
      case "/matches": content = matchesHtml(); break;
      case "/matches/new": content = matchFormHtml(); break;
      case "/players": content = playersHtml(); break;
      case "/servers": content = serversHtml(); break;
      case "/timetable": content = timetableHtml(); break;
      case "/agreement": content = agreementHtml(); break;
      case "/admin": content = adminHtml(); break;
      default: content = notFoundHtml();
    }
    html = shellHtml(content, page);
    if (routeState.playerModal) {
      html = html.replace("</main>", playerModalHtml() + "</main>");
    }
  }

  document.getElementById("app").innerHTML = html;
  document.documentElement.classList.toggle("dark", state.dark);
  bindPage(route, page);
  initCustomSelects();
}

function bindPage(route, page) {
  if (page === "/matches") {
    var input = document.querySelector("[data-match-search]");
    if (input) {
      input.focus();
      input.value = routeState.search;
      input.addEventListener("input", function () {
        routeState.search = input.value;
        rerenderKeepFocus(input);
      });
    }
    var filters = document.querySelectorAll("[data-filter]");
    filters.forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        routeState.filter = btn.textContent.trim();
        renderForRoute();
      });
    });
    var hl = document.querySelector(".hl-row");
    if (hl) hl.scrollIntoView({ block: "center" });
  }
  if (page === "/matches/new") {
    var fieldInputs = document.querySelectorAll("[data-kills], [data-deaths]");
    fieldInputs.forEach(function (el) {
      el.addEventListener("input", function () {});
    });
  }
}

function rerenderKeepFocus(input) {
  var start = input.selectionStart;
  renderForRoute();
  var next = document.querySelector("[data-match-search]");
  if (next) {
    next.focus();
    try { next.setSelectionRange(start, start); } catch (e) {}
  }
}

document.addEventListener("click", function (e) {
  var target = e.target;
  var el = target.closest ? target : target.parentNode;

  if (el.closest("[data-player-form]") && !el.closest("[data-close-player-form]")) return;

  var goScore = el.closest("[data-go-scoreboard]");
  if (goScore) {
    state.role = "spectator";
    localStorage.setItem(ROLE_KEY, state.role);
    window.location.hash = "#/dashboard";
    return;
  }
  var goAdmin = el.closest("[data-go-admin]");
  if (goAdmin) {
    if (driveGetToken() && driveGetFileId()) {
      state.role = "admin";
      localStorage.setItem(ROLE_KEY, state.role);
      window.location.hash = "#/admin";
    } else {
      state.role = "admin";
      localStorage.setItem(ROLE_KEY, state.role);
      driveConnect().then(function () {
        window.location.hash = "#/admin";
      }).catch(function () {});
    }
    return;
  }
  if (el.closest("[data-open-menu]")) { state.menuOpen = true; renderForRoute(); return; }
  if (el.closest("[data-close-menu]")) { state.menuOpen = false; renderForRoute(); return; }
  if (el.closest("[data-theme-toggle]")) {
    state.dark = !state.dark;
    document.documentElement.classList.toggle("dark", state.dark);
    localStorage.setItem(THEME_KEY, state.dark ? "dark" : "light");
    renderForRoute();
    return;
  }
  if (el.closest("[data-role-switch]")) {
    state.role = state.role === "admin" ? "spectator" : "admin";
    localStorage.setItem(ROLE_KEY, state.role);
    renderForRoute();
    return;
  }
  if (el.closest("[data-drive-connect]")) {
    driveConnect();
    return;
  }
  if (el.closest("[data-drive-disconnect]")) {
    driveDisconnect();
    return;
  }
  if (el.closest("[data-delete-match]")) {
    var delBtn = el.closest("[data-delete-match]");
    var matchId = Number(delBtn.getAttribute("data-delete-match"));
    customConfirm("Delete this match from the shared board?").then(function (yes) {
      if (yes) {
        data.matches = data.matches.filter(function (m) { return m.id !== matchId; });
        saveData();
        renderForRoute();
      }
    });
    return;
  }
  if (el.closest("[data-copy-url]")) {
    var copyBtn = el.closest("[data-copy-url]");
    var url = copyBtn.getAttribute("data-copy-url");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        copyBtn.innerHTML = icon("clipboard", 13);
        setTimeout(function () { copyBtn.innerHTML = icon("copy", 13); }, 1200);
      }).catch(function () {});
    }
    return;
  }
  if (el.closest("[data-add-player]")) {
    routeState.playerModal = {
      editId: 0,
      values: { realName: "", universalName: "", team: "alpha", serverName: "", partnerId: "" }
    };
    renderForRoute();
    return;
  }
  if (el.closest("[data-edit-player]")) {
    var editBtn = el.closest("[data-edit-player]");
    var playerId = Number(editBtn.getAttribute("data-edit-player"));
    var player = data.players.find(function (p) { return p.id === playerId; });
    if (player) {
      routeState.playerModal = {
        editId: player.id,
        values: {
          realName: player.realName,
          universalName: player.universalName,
          team: player.team,
          serverName: Object.values(player.serverNames)[0] || "",
          partnerId: player.universalPartnerId ? String(player.universalPartnerId) : ""
        }
      };
      renderForRoute();
    }
    return;
  }
  if (el.closest("[data-close-player-form]")) {
    routeState.playerModal = null;
    renderForRoute();
    return;
  }
  if (el.closest("[data-toggle-agreement-edit]")) {
    routeState.editingAgreement = !routeState.editingAgreement;
    renderForRoute();
    return;
  }
  var demoFilter = el.closest("[data-nav]");
  if (demoFilter) {
    state.menuOpen = false;
  }
});

document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.matches && el.matches("[data-player-field]")) {
    if (!routeState.playerModal) return;
    var field = el.getAttribute("data-player-field");
    routeState.playerModal.values[field] = el.value;
  }
});

document.addEventListener("submit", function (e) {
  var form = e.target;
  if (form.matches && form.matches("[data-match-form]")) {
    e.preventDefault();
    var get = function (name) {
      var el = form.querySelector("[data-field=\"" + name + "\"]");
      return el ? el.value : "";
    };
    var kills = {};
    var deaths = {};
    form.querySelectorAll("[data-kills]").forEach(function (el) { kills[el.getAttribute("data-kills")] = el.value; });
    form.querySelectorAll("[data-deaths]").forEach(function (el) { deaths[el.getAttribute("data-deaths")] = el.value; });

    var matchPlayers = data.players.map(function (p) {
      var k = Number(kills[p.id] || 0);
      var d = Number(deaths[p.id] || 0);
      var kd = d ? Number((k / d).toFixed(2)) : k;
      return {
        playerId: p.id,
        playerName: p.universalName,
        team: p.team,
        kills: k,
        deaths: d,
        kd: kd
      };
    });

    var params = new URLSearchParams((getRoute().split("?")[1] || ""));
    var editId = Number(params.get("id") || 0);
    var payload = {
      playedOn: get("playedOn"),
      matchType: get("matchType"),
      server: get("server"),
      alphaScore: Number(get("alphaScore") || 0),
      bravoScore: Number(get("bravoScore") || 0),
      note: get("note") || null,
      players: matchPlayers
    };

    if (editId > 0) {
      var idx = data.matches.findIndex(function (m) { return m.id === editId; });
      if (idx !== -1) {
        data.matches[idx] = Object.assign({}, data.matches[idx], payload);
      }
    } else {
      var mid = data.matches.reduce(function (acc, m) { return Math.max(acc, m.id); }, 0) + 1;
      data.matches.unshift(Object.assign({ id: mid }, payload));
    }
    saveData();
    routeState.search = "";
    routeState.filter = "all";
    window.location.hash = "#/matches";
    return;
  }
  if (form.matches && form.matches("[data-player-form]")) {
    e.preventDefault();
    var v = routeState.playerModal.values;
    if (!v.realName || !v.universalName || !v.serverName) return;
    if (routeState.playerModal.editId && routeState.playerModal.editId > 0) {
      var pidx = data.players.findIndex(function (p) { return p.id === routeState.playerModal.editId; });
      if (pidx !== -1) {
        data.players[pidx] = {
          id: data.players[pidx].id,
          realName: v.realName,
          universalName: v.universalName,
          team: v.team,
          serverNames: { blockpost: v.serverName },
          universalPartnerId: v.partnerId ? Number(v.partnerId) : null,
          avatarColor: data.players[pidx].avatarColor || "#19b7d9"
        };
      }
    } else {
      var nid = data.players.reduce(function (acc, p) { return Math.max(acc, p.id); }, 0) + 1;
      data.players.push({
        id: nid,
        realName: v.realName,
        universalName: v.universalName,
        team: v.team,
        serverNames: { blockpost: v.serverName },
        universalPartnerId: v.partnerId ? Number(v.partnerId) : null,
        avatarColor: "#19b7d9"
      });
    }
    saveData();
    routeState.playerModal = null;
    renderForRoute();
    return;
  }
  if (form.matches && form.matches("[data-agreement-form]")) {
    e.preventDefault();
    var titleEl = form.querySelector("[data-agreement-title]");
    var bodyEl = form.querySelector("[data-agreement-body]");
    data.agreement = {
      title: titleEl.value,
      body: bodyEl.value,
      updatedAt: new Date().toISOString()
    };
    saveData();
    routeState.editingAgreement = false;
    renderForRoute();
  }
});

window.addEventListener("hashchange", function () {
  routeState.search = "";
  routeState.filter = "all";
  routeState.editingAgreement = false;
  routeState.playerModal = null;
  state.menuOpen = false;
  renderForRoute();
});

document.documentElement.classList.toggle("dark", state.dark);
renderForRoute();
initCustomSelects();

function driveAutoPull() {
  if (state.role === "admin") return;
  var fileId = driveGetFileId();
  if (!fileId) return;
  drivePull().then(function (r) {
    if (r && r.lastUpdated) {
      var local = data.lastUpdated ? String(data.lastUpdated) : "";
      if (!local || String(r.lastUpdated) > local) {
        data = r;
        try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); } catch (e) {}
        renderForRoute();
      }
    }
  }).catch(function () {});
}

setInterval(driveAutoPull, 15000);

document.addEventListener("visibilitychange", function () {
  if (!document.hidden) driveAutoPull();
});

function initGapi() {
  if (window.gapi && gapi.load) {
    gapi.load("client", function () {
      gapi.client.init({ apiKey: DRIVE_API_KEY, discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"] })
        .then(function () { driveBoot(); })
        .catch(function () { driveBoot(); });
    });
  } else {
    setTimeout(initGapi, 500);
  }
}
initGapi();
})();
</script>
</body>
</html>
